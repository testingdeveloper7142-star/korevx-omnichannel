version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: korevx_postgres
    restart: always
    environment:
      POSTGRES_USER: korevx_user
      POSTGRES_PASSWORD: korevx_password
      POSTGRES_DB: korevx_omnichannel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korevx_user -d korevx_omnichannel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: korevx_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
